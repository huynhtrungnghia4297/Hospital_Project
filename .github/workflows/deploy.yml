name: CI/CD Docker Workflow for DigitalOcean

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  build_and_push_docker_image:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image name
        run: |
          echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "Using image name: ${{ env.IMAGE_NAME }}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Hospital_API
          file: ./Hospital_API/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest

      - name: Verify image push
        run: |
          echo "Verifying pushed images..."
          echo "Latest tag: ghcr.io/${{ env.IMAGE_NAME }}:latest"
          echo "SHA tag: ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"

  deploy-to-production:
    needs: build_and_push_docker_image
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Set image name
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Deploy to DigitalOcean Droplet via Docker
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          password: ${{ secrets.DO_PASSWORD }}
          script: |
            # Login to GitHub Container Registry
            echo "Logging into GitHub Container Registry..."
            echo ${{ secrets.CR_PAT }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Print current images for debugging
            echo "Current Docker images:"
            docker images
            
            # Variables
            IMAGE_PULL_TAG="ghcr.io/${{ env.IMAGE_NAME }}:latest"
            CONTAINER_NAME="hospital-api-container"
            
            echo "Attempting to pull image: $IMAGE_PULL_TAG"
            
            # Stop and remove the old container
            echo "Stopping and removing old container..."
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true

            # Pull the latest image
            echo "Pulling latest Docker image..."
            docker pull $IMAGE_PULL_TAG
            
            # Verify pull success
            echo "Verifying pulled image..."
            docker images | grep ${{ env.IMAGE_NAME }}

            # Run new container
            echo "Starting new container..."
            docker run -d \
              --name $CONTAINER_NAME \
              --restart always \
              -p 8080:8080 \
              -e ASPNETCORE_URLS=http://+:8080 \
              -e "ConnectionStrings__DefaultConnection=${{ secrets.ASPNETCORE_CONNECTIONSTRING }}" \
              $IMAGE_PULL_TAG

            # Debug logs
            echo "Container status:"
            docker ps -a | grep $CONTAINER_NAME
            
            echo "Waiting 15 seconds for container to initialize..."
            sleep 15
            echo "Container logs:"
            docker logs $CONTAINER_NAME

            # Clean up
            echo "Cleaning up old images..."
            docker image prune -af

            echo "Deployment completed!"
            echo "Final container status:"
            docker ps -a | grep $CONTAINER_NAME
