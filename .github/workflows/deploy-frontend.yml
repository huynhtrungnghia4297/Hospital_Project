name: CI/CD React App to DigitalOcean

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  build-and-deploy-frontend:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read
      contents: read

    defaults:
      run:
        working-directory: ./hospital-react-app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for changes in frontend app
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'hospital-react-app/**'

      - name: Setup Node.js
        if: steps.filter.outputs.frontend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        if: steps.filter.outputs.frontend == 'true'
        run: npm install

      - name: Build React App
        if: steps.filter.outputs.frontend == 'true'
        run: npm run build

      # Stop frontend container before deploying
      - name: Stop frontend container
        if: steps.filter.outputs.frontend == 'true'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          password: ${{ secrets.DO_PASSWORD }}
          script: |
            docker-compose stop frontend-server
            rm -rf /var/www/hospital-react-app/*

      # Deploy the build files
      - name: Deploy to DigitalOcean
        if: steps.filter.outputs.frontend == 'true'
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          password: ${{ secrets.DO_PASSWORD }}
          source: "hospital-react-app/build/*"
          target: "/var/www/hospital-react-app"
          strip_components: 1

      # Start frontend container after deployment
      - name: Start frontend container
        if: steps.filter.outputs.frontend == 'true'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          password: ${{ secrets.DO_PASSWORD }}
          script: |
            sudo chown -R www-data:www-data /var/www/hospital-react-app
            sudo find /var/www/hospital-react-app -type d -exec chmod 755 {} \;
            sudo find /var/www/hospital-react-app -type f -exec chmod 644 {} \;
            docker-compose start frontend-server
